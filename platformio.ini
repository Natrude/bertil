; PlatformIO-konfiguration för klockslagaren.
;
; Bygg:          pio run
; Ladda upp:     pio run -t upload
; Seriekonsol:   pio device monitor

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

; Samma hastighet som config::kSerialBaud i include/Config.h.
monitor_speed = 115200
; Skicka radslut när man trycker Enter i seriemonitorn.
monitor_eol = LF
monitor_echo = yes

; Låsta versioner så att bygget blir likadant varje gång.
lib_deps =
    arduino-libraries/Servo@^1.2.2
    adafruit/RTClib@^2.1.4

build_flags =
    -Wall
