<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480">
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="940" height="480" fill="#fbfbf8"/>

  <!-- ===== Vänster: sett ovanifrån ===== -->
  <!-- Servo -->
  <rect x="95" y="225" width="130" height="70" rx="6" fill="#3b6ea8" stroke="#22456e" stroke-width="2"/>
  <rect x="80" y="252" width="160" height="16" rx="3" fill="#3b6ea8" stroke="#22456e" stroke-width="2"/>

  <!-- Spökläge: slag -->
  <line x1="160" y1="260" x2="244.5" y2="268.9" stroke="#999" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M244.5,268.9 Q335,280 422,298" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="430" cy="300" r="12" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Klocka -->
  <circle cx="440" cy="368" r="56" fill="#e3b23c" stroke="#9c7412" stroke-width="2"/>
  <circle cx="440" cy="368" r="20" fill="#c9971f" stroke="#9c7412" stroke-width="1.5"/>

  <!-- Viloläge: servoarm -->
  <path d="M160,251 L248,255 A5,5 0 0 1 248,265 L160,269 Z" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <circle cx="160" cy="260" r="12" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <circle cx="160" cy="260" r="4" fill="#ddd" stroke="#333" stroke-width="1"/>
  <!-- Tråd -->
  <line x1="185" y1="264" x2="418" y2="264" stroke="#444" stroke-width="2.5"/>
  <circle cx="185" cy="264" r="2.5" fill="#444"/>
  <!-- Klämbit -->
  <rect x="190" y="249" width="52" height="22" rx="2" fill="#d9b382" fill-opacity="0.85" stroke="#7a5a2e" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="1.2">
    <circle cx="201" cy="258" r="4.5" fill="#c8c8c8"/>
    <line x1="198" y1="258" x2="204" y2="258"/><line x1="201" y1="255" x2="201" y2="261"/>
    <circle cx="231" cy="258" r="4.5" fill="#c8c8c8"/>
    <line x1="228" y1="258" x2="234" y2="258"/><line x1="231" y1="255" x2="231" y2="261"/>
  </g>
  <!-- Vikt -->
  <circle cx="430" cy="264" r="12" fill="#666" stroke="#222" stroke-width="2"/>

  <!-- Luft-mått -->
  <line x1="460" y1="277" x2="460" y2="311" stroke="#c0392b" stroke-width="1.5" marker-start="url(#pil)" marker-end="url(#pil)"/>
  <!-- Rörelsepil -->
  <path d="M300,232 Q330,240 345,262" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#pil)"/>

  <!-- Avdelare -->
  <line x1="560" y1="40" x2="560" y2="440" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== Höger: infästning från sidan ===== -->
  <!-- Servo -->
  <rect x="610" y="190" width="120" height="80" rx="5" fill="#3b6ea8" stroke="#22456e" stroke-width="2"/>
  <rect x="595" y="205" width="150" height="8" rx="2" fill="#3b6ea8" stroke="#22456e" stroke-width="2"/>
  <rect x="633" y="176" width="14" height="14" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <!-- Servoarm -->
  <rect x="620" y="168" width="115" height="9" rx="4" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <!-- Tråd med böjd ände -->
  <path d="M672,184 L672,166 L885,166" fill="none" stroke="#444" stroke-width="2.5"/>
  <!-- Klämbit och skruvar -->
  <rect x="678" y="155" width="52" height="11" rx="2" fill="#d9b382" stroke="#7a5a2e" stroke-width="1.5"/>
  <g fill="#c8c8c8" stroke="#333" stroke-width="1.2">
    <rect x="684" y="149" width="12" height="6" rx="1.5"/>
    <rect x="712" y="149" width="12" height="6" rx="1.5"/>
    <rect x="688" y="177" width="4" height="5"/>
    <rect x="716" y="177" width="4" height="5"/>
  </g>
  <g fill="#999" stroke="#333" stroke-width="1.2">
    <rect x="685" y="181" width="10" height="5" rx="1"/>
    <rect x="713" y="181" width="10" height="5" rx="1"/>
  </g>
  <!-- Vikt -->
  <rect x="880" y="156" width="22" height="20" rx="3" fill="#666" stroke="#222" stroke-width="2"/>
  <rect x="872" y="160" width="10" height="12" fill="#222" opacity="0.6"/>
</svg>
